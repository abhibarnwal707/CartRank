[project]
name = "cartrank"
version = "0.1.0"
description = "Product search and recommendation: hybrid retrieval, reranking, two-tower recsys, LLM query parser"
readme = "README.md"
requires-python = ">=3.12,<3.13"
dependencies = [
    "bm25s>=0.3.14",
    "faiss-cpu>=1.15.1",
    "numpy",
    "pandas",
    "pyarrow",
    "pydantic>=2",
    "scipy",
    "scikit-learn",
    "pystemmer>=3.1.0",
    "sentence-transformers>=6.2.0",
    "httpx>=0.28.1",
    "streamlit>=1.66.1",
]

[dependency-groups]
dev = [
    "openpyxl>=3.1.5",
    "pytest",
    "ruff",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/cartrank"]

[tool.ruff]
line-length = 100
extend-exclude = ["notebooks"]
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.ruff.lint.per-file-ignores]
# long instruction strings written into the labelling sheet
"src/cartrank/eval/demo_labels.py" = ["E501"]
"src/cartrank/recsys/package_kaggle.py" = ["E501"]
"src/cartrank/query/parser.py" = ["E501"]  # prompt text
"src/cartrank/eval/report_query.py" = ["E501"]
"src/cartrank/eval/run_phase7.py" = ["E501"]

[tool.pytest.ini_options]
testpaths = ["tests"]
