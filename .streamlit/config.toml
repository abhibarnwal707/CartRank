# Light theme is forced so Streamlit's own widgets never flip dark on a visitor's dark-mode OS
# while the page itself is white.
[theme]
base = "light"
primaryColor = "#141414"
backgroundColor = "#eceeec"
secondaryBackgroundColor = "#ffffff"
textColor = "#141414"

[client]
toolbarMode = "minimal"

[browser]
gatherUsageStats = false

# Serves app/static/ (the scene photographs) at app/static/...
[server]
enableStaticServing = true
